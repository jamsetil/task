# Profile: docker-net — integrations ENABLED (Postgres + ActiveMQ on Docker network)
# Use with: SPRING_PROFILES_ACTIVE=docker-net
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://gym-db:5432/gymcrm}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://activemq:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}

logging:
  level:
    org.example: INFO
