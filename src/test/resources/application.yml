spring:
  datasource:
    url: jdbc:h2:mem:gymcrm;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    in-memory: true

app:
  messaging:
    trainer-workload-queue: trainer.workload.queue

eureka:
  client:
    enabled: false

springdoc:
  swagger-ui:
    enabled: false

username-generator:
  char: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789

jwt:
  secret: testSecretKeyForJwtGenerationThatShouldBeLongEnough123456
  expiration-ms: 3600000

security:
  login:
    max-attempts: 3
    lockout-duration-minutes: 5

cors:
  allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
